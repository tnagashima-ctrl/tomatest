<script>
(function () {
  "use strict";

  var CONFIG = {
    WEBHOOK_URL: "",
    PRIVACY_POLICY_URL: "https://pntwhere.com/privacy",
    HERO_TITLE: "土地・物件を探す",
    HERO_LEAD: "ご希望の条件を選択のうえ、下記フォームよりお問い合わせください。",
  };

  var MOUNT_ATTR = "data-lsf-mounted";
  var currentScript = document.currentScript;
  if (currentScript && currentScript.getAttribute(MOUNT_ATTR)) return;
  if (currentScript) currentScript.setAttribute(MOUNT_ATTR, "1");

  var PREFECTURES = [
    { region: "北海道", list: ["北海道"] },
    { region: "東北", list: ["青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県"] },
    { region: "関東", list: ["茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県"] },
    { region: "中部", list: ["新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県"] },
    { region: "近畿", list: ["三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県"] },
    { region: "中国", list: ["鳥取県", "島根県", "岡山県", "広島県", "山口県"] },
    { region: "四国", list: ["徳島県", "香川県", "愛媛県", "高知県"] },
    { region: "九州・沖縄", list: ["福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"] },
  ];

  var LAND_TYPES = ["空き地", "古屋根の建物", "月極駐車場", "コインパーキング"];
  var POSITIONS = ["取締役・社長", "部長・マネージャー", "課長・リーダー", "主任・担当者", "フリーランス"];
  var PURCHASE_METHODS = [
    "自社で土地・物件を直接仕入れている",
    "直接仕入れと仲介情報の両方を活用",
    "仲介業者の情報のみを活用",
    "現在土地や物件の仕入れは行っていない",
  ];
  var PURCHASE_POLICIES = [
    "今後、直接仕入れを行っていきたい",
    "今後、直接仕入れを行う予定はない",
  ];

  var STYLE_ID = "lsf-style";
  if (!document.getElementById(STYLE_ID)) {
    var style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent = [
      ".lsf-root{--lsf-accent:#1a7f5a;--lsf-accent-dark:#125c40;--lsf-bg:#f7f8f7;--lsf-border:#dde1de;--lsf-text:#20261f;--lsf-muted:#6b756a;--lsf-danger:#d3402b;box-sizing:border-box;max-width:900px;margin:0 auto;padding:32px 20px 40px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--lsf-text);}",
      ".lsf-root *{box-sizing:border-box;}",
      ".lsf-header{text-align:center;margin-bottom:28px;}",
      ".lsf-header h2{font-size:24px;font-weight:700;margin:0 0 8px;}",
      ".lsf-header p{font-size:14px;color:var(--lsf-muted);margin:0;line-height:1.7;}",
      ".lsf-section{background:#fff;border:1px solid var(--lsf-border);border-radius:12px;padding:24px 20px;margin:0;}",
      ".lsf-columns{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;}",
      ".lsf-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;}",
      "@media (max-width:680px){.lsf-columns{flex-direction:column;}}",
      ".lsf-section-title{font-size:15px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;}",
      ".lsf-section-title .lsf-req{font-size:11px;font-weight:600;color:#fff;background:var(--lsf-danger);border-radius:4px;padding:2px 6px;}",
      ".lsf-section-title .lsf-opt{font-size:11px;font-weight:600;color:var(--lsf-muted);background:#eef0ee;border-radius:4px;padding:2px 6px;}",
      ".lsf-section-desc{font-size:12px;color:var(--lsf-muted);margin:0 0 14px;}",
      ".lsf-select{width:100%;padding:11px 12px;font-size:14px;border:1px solid var(--lsf-border);border-radius:8px;background:#fff;color:var(--lsf-text);transition:border-color .15s ease;}",
      ".lsf-select:focus{outline:none;border-color:var(--lsf-accent);box-shadow:0 0 0 3px rgba(26,127,90,.12);}",
      ".lsf-select:disabled{background:#f5f6f5;color:var(--lsf-muted);cursor:not-allowed;}",
      ".lsf-select.lsf-invalid{border-color:var(--lsf-danger);}",
      ".lsf-checkbox-group{display:flex;flex-wrap:wrap;gap:10px;}",
      ".lsf-checkbox{position:relative;}",
      ".lsf-checkbox input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}",
      ".lsf-checkbox label{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;border:1px solid var(--lsf-border);border-radius:10px;cursor:pointer;user-select:none;transition:all .15s ease;background:#fff;}",
      ".lsf-checkbox .lsf-box{width:16px;height:16px;border:1.5px solid var(--lsf-border);border-radius:4px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;transition:all .15s ease;}",
      ".lsf-checkbox .lsf-box svg{width:10px;height:10px;opacity:0;transition:opacity .1s;}",
      ".lsf-checkbox input:checked + label{border-color:var(--lsf-accent);background:#eefaf4;}",
      ".lsf-checkbox input:checked + label .lsf-box{background:var(--lsf-accent);border-color:var(--lsf-accent);}",
      ".lsf-checkbox input:checked + label .lsf-box svg{opacity:1;}",
      ".lsf-checkbox input:focus-visible + label{outline:2px solid var(--lsf-accent);outline-offset:2px;}",
      ".lsf-radio-group{flex-direction:column;flex-wrap:nowrap;}",
      ".lsf-radio-group .lsf-checkbox label{display:flex;width:100%;line-height:1.5;}",
      ".lsf-radio-group .lsf-box{border-radius:50%;}",
      ".lsf-field{margin-bottom:16px;}",
      ".lsf-field:last-child{margin-bottom:0;}",
      ".lsf-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}",
      ".lsf-field label .lsf-req{font-size:10px;font-weight:600;color:#fff;background:var(--lsf-danger);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}",
      ".lsf-field label .lsf-opt{font-size:10px;font-weight:600;color:var(--lsf-muted);background:#eef0ee;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}",
      ".lsf-field input[type=text],.lsf-field input[type=email],.lsf-field input[type=tel]{width:100%;padding:11px 12px;font-size:14px;border:1px solid var(--lsf-border);border-radius:8px;background:#fff;color:var(--lsf-text);transition:border-color .15s ease;}",
      ".lsf-field input:focus{outline:none;border-color:var(--lsf-accent);box-shadow:0 0 0 3px rgba(26,127,90,.12);}",
      ".lsf-field input.lsf-invalid{border-color:var(--lsf-danger);}",
      ".lsf-name-row{display:flex;gap:10px;}",
      ".lsf-name-sub{flex:1;min-width:0;}",
      ".lsf-name-sub-label{display:block;font-size:11px;color:var(--lsf-muted);margin-bottom:4px;}",
      ".lsf-visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}",
      ".lsf-error-msg{font-size:12px;color:var(--lsf-danger);margin-top:6px;display:none;}",
      ".lsf-error-msg.lsf-show{display:block;}",
      ".lsf-consent{display:flex;align-items:flex-start;gap:10px;}",
      ".lsf-consent input{margin-top:3px;flex-shrink:0;width:16px;height:16px;accent-color:var(--lsf-accent);cursor:pointer;}",
      ".lsf-consent label{font-size:13px;line-height:1.6;font-weight:400;margin:0;cursor:pointer;}",
      ".lsf-consent a{color:var(--lsf-accent);text-decoration:underline;}",
      ".lsf-submit-wrap{margin-top:8px;}",
      ".lsf-submit{width:100%;padding:15px;font-size:15px;font-weight:700;color:#fff;background:var(--lsf-accent);border:none;border-radius:10px;cursor:pointer;transition:background .15s ease;}",
      ".lsf-submit:hover:not(:disabled){background:var(--lsf-accent-dark);}",
      ".lsf-submit:disabled{opacity:.6;cursor:not-allowed;}",
      ".lsf-banner{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;line-height:1.6;}",
      ".lsf-banner.lsf-show{display:block;}",
      ".lsf-banner.lsf-error{background:#fdecea;color:var(--lsf-danger);border:1px solid #f6c6bf;}",
      ".lsf-banner.lsf-success{background:#eefaf4;color:var(--lsf-accent-dark);border:1px solid #bfe6d4;}",
      ".lsf-success-view{text-align:center;padding:40px 16px;}",
      ".lsf-success-view h3{font-size:20px;margin:0 0 8px;}",
      ".lsf-success-view p{font-size:14px;color:var(--lsf-muted);line-height:1.7;}",
      "@media (max-width:480px){.lsf-root{padding:24px 14px 32px;}.lsf-section{padding:18px 14px;}}"
    ].join("\n");
    document.head.appendChild(style);
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);
    });
    return node;
  }

  var uid = 0;
  function nextId(prefix) {
    uid += 1;
    return prefix + "-" + uid;
  }

  var CHECK_SVG =
    '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.2 11.7L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function buildForm(mountPoint) {
    var root = el("div", { class: "lsf-root" });

    root.appendChild(
      el("div", { class: "lsf-header" }, [
        el("h2", { text: CONFIG.HERO_TITLE }),
        el("p", { text: CONFIG.HERO_LEAD }),
      ])
    );

    var form = el("form", { id: "lsf-form", novalidate: "novalidate" });
    var banner = el("div", { class: "lsf-banner" });
    form.appendChild(banner);

    var typeName = "lsf-type-" + Date.now();
    var columns = el("div", { class: "lsf-columns" });
    var leftCol = el("div", { class: "lsf-col lsf-col-left" });
    var rightCol = el("div", { class: "lsf-col lsf-col-right" });
    columns.appendChild(leftCol);
    columns.appendChild(rightCol);

    var prefId = nextId("lsf-pref");
    var prefSelect = el("select", { class: "lsf-select", id: prefId, name: "prefecture" });
    prefSelect.required = true;
    var prefPlaceholder = el("option", { value: "", text: "選択してください" });
    prefPlaceholder.disabled = true;
    prefPlaceholder.selected = true;
    prefSelect.appendChild(prefPlaceholder);
    PREFECTURES.forEach(function (group) {
      var optgroup = el("optgroup", { label: group.region });
      group.list.forEach(function (pref) {
        optgroup.appendChild(el("option", { value: pref, text: pref }));
      });
      prefSelect.appendChild(optgroup);
    });
    var prefSection = el("div", { class: "lsf-section lsf-cell-pref" }, [
      el("div", { class: "lsf-section-title" }, [
        el("span", { text: "探索したい都道府県" }),
        el("span", { class: "lsf-req", text: "必須" }),
      ]),
    ]);
    var prefError = el("div", { class: "lsf-error-msg", text: "都道府県を選択してください" });
    prefSection.appendChild(prefSelect);
    prefSection.appendChild(prefError);
    leftCol.appendChild(prefSection);

    prefSelect.addEventListener("change", function () {
      prefSelect.classList.remove("lsf-invalid");
      clearFieldError(prefSection, prefError);
    });

    var typeSection = el("div", { class: "lsf-section lsf-cell-type" }, [
      el("div", { class: "lsf-section-title" }, [
        el("span", { text: "探索したい土地・物件種別" }),
        el("span", { class: "lsf-req", text: "必須" }),
      ]),
      el("p", { class: "lsf-section-desc", text: "複数選択可" }),
    ]);
    var typeError = el("div", { class: "lsf-error-msg", text: "1つ以上選択してください" });
    var typeGroup = el("div", { class: "lsf-checkbox-group" });
    LAND_TYPES.forEach(function (t) {
      var id = nextId("lsf-type");
      var input = el("input", { type: "checkbox", name: typeName, id: id, value: t });
      var label = el("label", { for: id }, [
        el("span", { class: "lsf-box", html: CHECK_SVG }),
        el("span", { text: t }),
      ]);
      input.addEventListener("change", function () {
        clearFieldError(typeSection, typeError);
      });
      typeGroup.appendChild(el("div", { class: "lsf-checkbox" }, [input, label]));
    });
    typeSection.appendChild(typeGroup);
    typeSection.appendChild(typeError);
    leftCol.appendChild(typeSection);

    function textField(labelText, type, required, placeholder, cellClass, fieldName, targetCol) {
      var id = nextId("lsf-field");
      var card = el("div", { class: "lsf-section " + cellClass });
      var wrap = el("div", { class: "lsf-field" });
      var lbl = el("label", { for: id }, [
        document.createTextNode(labelText),
        el("span", {
          class: required ? "lsf-req" : "lsf-opt",
          text: required ? "必須" : "任意",
        }),
      ]);
      var input = el("input", { type: type, id: id, name: fieldName, placeholder: placeholder || "" });
      if (required) input.required = true;
      var err = el("div", { class: "lsf-error-msg" });
      wrap.appendChild(lbl);
      wrap.appendChild(input);
      wrap.appendChild(err);
      card.appendChild(wrap);
      targetCol.appendChild(card);
      input.addEventListener("input", function () {
        input.classList.remove("lsf-invalid");
        err.classList.remove("lsf-show");
      });
      return { input: input, err: err, card: card };
    }

    // 単一選択（ラジオ）の設問カード
    function radioField(titleText, fieldName, options, errorText, cellClass, targetCol) {
      var card = el("div", { class: "lsf-section " + cellClass }, [
        el("div", { class: "lsf-section-title" }, [
          el("span", { text: titleText }),
          el("span", { class: "lsf-req", text: "必須" }),
        ]),
        el("p", { class: "lsf-section-desc", text: "1つ選択してください" }),
      ]);
      var err = el("div", { class: "lsf-error-msg", text: errorText });
      var group = el("div", { class: "lsf-checkbox-group lsf-radio-group", role: "radiogroup" });
      options.forEach(function (opt) {
        var id = nextId("lsf-radio");
        var input = el("input", { type: "radio", name: fieldName, id: id, value: opt });
        input.required = true;
        var label = el("label", { for: id }, [
          el("span", { class: "lsf-box", html: CHECK_SVG }),
          el("span", { text: opt }),
        ]);
        input.addEventListener("change", function () {
          clearFieldError(card, err);
        });
        group.appendChild(el("div", { class: "lsf-checkbox" }, [input, label]));
      });
      card.appendChild(group);
      card.appendChild(err);
      targetCol.appendChild(card);
      return {
        card: card,
        err: err,
        value: function () {
          var checked = form.querySelector('input[name="' + fieldName + '"]:checked');
          return checked ? checked.value : "";
        },
      };
    }

    var companyField = textField("会社名", "text", true, "例）株式会社〇〇", "lsf-cell-company", "company", rightCol);

    var positionId = nextId("lsf-position");
    var positionSelect = el("select", { class: "lsf-select", id: positionId, name: "position" });
    positionSelect.required = true;
    var positionPlaceholder = el("option", { value: "", text: "選択してください" });
    positionPlaceholder.disabled = true;
    positionPlaceholder.selected = true;
    positionSelect.appendChild(positionPlaceholder);
    POSITIONS.forEach(function (p) {
      positionSelect.appendChild(el("option", { value: p, text: p }));
    });
    var positionCard = el("div", { class: "lsf-section lsf-cell-position" }, [
      el("div", { class: "lsf-section-title" }, [
        el("span", { text: "役職" }),
        el("span", { class: "lsf-req", text: "必須" }),
      ]),
    ]);
    var positionError = el("div", { class: "lsf-error-msg", text: "役職を選択してください" });
    positionCard.appendChild(positionSelect);
    positionCard.appendChild(positionError);
    leftCol.appendChild(positionCard);
    positionSelect.addEventListener("change", function () {
      positionSelect.classList.remove("lsf-invalid");
      clearFieldError(positionCard, positionError);
    });

    var nameCard = el("div", { class: "lsf-section lsf-cell-name" });
    var nameWrap = el("div", { class: "lsf-field" });
    var seiId = nextId("lsf-sei");
    var meiId = nextId("lsf-mei");
    var nameLbl = el("label", {}, [
      document.createTextNode("氏名"),
      el("span", { class: "lsf-req", text: "必須" }),
    ]);
    var seiInput = el("input", { type: "text", id: seiId, placeholder: "例）山田" });
    var meiInput = el("input", { type: "text", id: meiId, placeholder: "例）太郎" });
    seiInput.required = true;
    meiInput.required = true;
    var nameRow = el("div", { class: "lsf-name-row" }, [
      el("div", { class: "lsf-name-sub" }, [
        el("span", { class: "lsf-name-sub-label", text: "姓" }),
        seiInput,
      ]),
      el("div", { class: "lsf-name-sub" }, [
        el("span", { class: "lsf-name-sub-label", text: "名" }),
        meiInput,
      ]),
    ]);
    var nameError = el("div", { class: "lsf-error-msg" });
    var fullNameInput = el("input", {
      type: "text",
      name: "name",
      class: "lsf-visually-hidden",
      tabindex: "-1",
      "aria-hidden": "true",
    });
    nameWrap.appendChild(nameLbl);
    nameWrap.appendChild(nameRow);
    nameWrap.appendChild(nameError);
    nameCard.appendChild(nameWrap);
    nameCard.appendChild(fullNameInput);
    rightCol.appendChild(nameCard);

    function fullName() {
      return (seiInput.value.trim() + " " + meiInput.value.trim()).trim();
    }
    function syncFullName() {
      fullNameInput.value = fullName();
    }
    [seiInput, meiInput].forEach(function (inp) {
      inp.addEventListener("input", function () {
        inp.classList.remove("lsf-invalid");
        nameError.classList.remove("lsf-show");
        syncFullName();
      });
    });

    var emailField = textField("メールアドレス", "email", true, "例）example@example.com", "lsf-cell-email", "email", rightCol);
    var telField = textField("電話番号", "tel", true, "例）090-1234-5678", "lsf-cell-tel", "tel", rightCol);
    telField.input.setAttribute("pattern", "[0-9+\\-\\(\\)\\s]{9,15}");

    // 仕入れ方法・仕入れ方針（2カラムの下に横並び、スマホでは縦積み）
    var purchaseColumns = el("div", { class: "lsf-columns" });
    var purchaseLeft = el("div", { class: "lsf-col" });
    var purchaseRight = el("div", { class: "lsf-col" });
    purchaseColumns.appendChild(purchaseLeft);
    purchaseColumns.appendChild(purchaseRight);

    var methodField = radioField(
      "現在の土地・物件の仕入れ方法",
      "purchase_method",
      PURCHASE_METHODS,
      "仕入れ方法を選択してください",
      "lsf-cell-purchase-method",
      purchaseLeft
    );
    var policyField = radioField(
      "今後の土地・物件の仕入れ方針",
      "purchase_policy",
      PURCHASE_POLICIES,
      "仕入れ方針を選択してください",
      "lsf-cell-purchase-policy",
      purchaseRight
    );

    var consentCard = el("div", { class: "lsf-section lsf-cell-consent" });
    var consentId = nextId("lsf-consent");
    var consentWrap = el("div", { class: "lsf-field" });
    var consentInput = el("input", { type: "checkbox", id: consentId });
    consentInput.required = true;
    var consentLabel = el("label", { for: consentId }, [
      document.createTextNode("プライバシーポリシーに同意する "),
    ]);
    var ppLink = el("a", {
      href: CONFIG.PRIVACY_POLICY_URL,
      target: "_blank",
      rel: "noopener noreferrer",
      text: "（プライバシーポリシーを見る）",
    });
    consentLabel.appendChild(ppLink);
    var consentRow = el("div", { class: "lsf-consent" }, [consentInput, consentLabel]);
    var consentError = el("div", { class: "lsf-error-msg", text: "プライバシーポリシーへの同意が必要です" });
    consentInput.addEventListener("change", function () {
      consentError.classList.remove("lsf-show");
    });
    consentWrap.appendChild(consentRow);
    consentWrap.appendChild(consentError);
    consentCard.appendChild(consentWrap);

    form.appendChild(columns);
    form.appendChild(purchaseColumns);
    form.appendChild(consentCard);

    var submitBtn = el("button", { type: "submit", class: "lsf-submit", text: "送信する" });
    form.appendChild(el("div", { class: "lsf-submit-wrap" }, [submitBtn]));

    root.appendChild(form);
    mountPoint.appendChild(root);

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var TEL_RE = /^[0-9\-+()\s]{9,15}$/;

    function showFieldError(section, errEl) {
      errEl.classList.add("lsf-show");
      section.classList && section.classList.add("lsf-invalid-section");
    }
    function clearFieldError(section, errEl) {
      errEl.classList.remove("lsf-show");
    }
    function showBanner(type, message) {
      banner.className = "lsf-banner lsf-show " + (type === "error" ? "lsf-error" : "lsf-success");
      banner.textContent = message;
      banner.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    function hideBanner() {
      banner.className = "lsf-banner";
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      hideBanner();
      var valid = true;

      var prefValue = prefSelect.value;
      if (!prefValue) {
        prefSelect.classList.add("lsf-invalid");
        showFieldError(prefSection, prefError);
        valid = false;
      }

      var types = Array.prototype.slice.call(
        form.querySelectorAll('input[name="' + typeName + '"]:checked')
      );
      if (types.length === 0) {
        showFieldError(typeSection, typeError);
        valid = false;
      }

      if (!companyField.input.value.trim()) {
        companyField.input.classList.add("lsf-invalid");
        companyField.err.textContent = "入力してください";
        companyField.err.classList.add("lsf-show");
        valid = false;
      }

      if (!positionSelect.value) {
        positionSelect.classList.add("lsf-invalid");
        showFieldError(positionCard, positionError);
        valid = false;
      }

      if (!seiInput.value.trim() || !meiInput.value.trim()) {
        if (!seiInput.value.trim()) seiInput.classList.add("lsf-invalid");
        if (!meiInput.value.trim()) meiInput.classList.add("lsf-invalid");
        nameError.textContent = "姓・名を入力してください";
        nameError.classList.add("lsf-show");
        valid = false;
      }

      if (!emailField.input.value.trim()) {
        emailField.input.classList.add("lsf-invalid");
        emailField.err.textContent = "メールアドレスを入力してください";
        emailField.err.classList.add("lsf-show");
        valid = false;
      } else if (!EMAIL_RE.test(emailField.input.value.trim())) {
        emailField.input.classList.add("lsf-invalid");
        emailField.err.textContent = "メールアドレスの形式が正しくありません";
        emailField.err.classList.add("lsf-show");
        valid = false;
      }

      if (!telField.input.value.trim()) {
        telField.input.classList.add("lsf-invalid");
        telField.err.textContent = "電話番号を入力してください";
        telField.err.classList.add("lsf-show");
        valid = false;
      } else if (!TEL_RE.test(telField.input.value.trim())) {
        telField.input.classList.add("lsf-invalid");
        telField.err.textContent = "電話番号の形式が正しくありません";
        telField.err.classList.add("lsf-show");
        valid = false;
      }

      var methodValue = methodField.value();
      if (!methodValue) {
        showFieldError(methodField.card, methodField.err);
        valid = false;
      }

      var policyValue = policyField.value();
      if (!policyValue) {
        showFieldError(policyField.card, policyField.err);
        valid = false;
      }

      if (!consentInput.checked) {
        showFieldError(consentCard, consentError);
        valid = false;
      }

      if (!valid) {
        showBanner("error", "未入力・入力エラーの項目があります。ご確認ください。");
        return;
      }

      syncFullName();

      var payload = {
        prefecture: prefValue,
        land_types: types.map(function (t) {
          return t.value;
        }),
        name: fullName(),
        last_name: seiInput.value.trim(),
        first_name: meiInput.value.trim(),
        company: companyField.input.value.trim(),
        position: positionSelect.value,
        email: emailField.input.value.trim(),
        tel: telField.input.value.trim(),
        purchase_method: methodValue,
        purchase_policy: policyValue,
        privacy_consent: true,
        submitted_at: new Date().toISOString(),
        page_url: window.location.href,
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      submitForm(payload)
        .then(function () {
          renderSuccessView(root, form, banner);
        })
        .catch(function (err) {
          console.error("[lsf] send failed:", err);
          showBanner("error", "送信に失敗しました。時間をおいて再度お試しください。");
          submitBtn.disabled = false;
          submitBtn.textContent = "送信する";
        });
    });
  }

  function submitForm(payload) {
    if (!CONFIG.WEBHOOK_URL) {
      console.log("[lsf] WEBHOOK_URL 未設定のため送信をスキップしました。payload:", payload);
      return Promise.resolve();
    }
    return fetch(CONFIG.WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res;
    });
  }

  function renderSuccessView(root, form, banner) {
    form.style.display = "none";
    banner.className = "lsf-banner";
    var success = el("div", { class: "lsf-success-view" }, [
      el("h3", { text: "送信が完了しました" }),
      el("p", { text: "お問い合わせいただきありがとうございます。担当者よりご連絡いたします。" }),
    ]);
    root.appendChild(success);
  }

  function mount() {
    var mountPoint = document.getElementById("form-root");
    if (!mountPoint) {
      mountPoint = el("div", { id: "form-root" });
      if (currentScript && currentScript.parentNode) {
        currentScript.parentNode.insertBefore(mountPoint, currentScript.nextSibling);
      } else {
        document.body.appendChild(mountPoint);
      }
    }
    buildForm(mountPoint);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
  </script>
